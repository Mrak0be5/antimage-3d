<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<script type="module">

// === CHARACTER CODE ===
import * as THREE from 'three';

// === Advanced Character with Skeleton and Animations ===
class AntiMageCharacter {
    constructor(scene) {
        this.scene = scene;
        this.skeleton = null;
        this.bones = {};
        this.meshes = [];
        this.animations = {};
        this.currentAnimation = null;
        this.animationTime = 0;
        this.animationSpeed = 1.0;

        this.buildCharacter();
        this.setupAnimations();
    }

    buildCharacter() {
        // Create skeleton
        this.createSkeleton();

        // Create detailed meshes
        this.createDetailedHead();
        this.createDetailedTorso();
        this.createDetailedArms();
        this.createDetailedLegs();
        this.createDetailedHair();
        this.createDetailedArmor();
        this.createMagicBlades();

        // Add accessories
        this.createTattoos();
        this.createJewelry();
    }

    createSkeleton() {
        const bones = [];

        // Root
        const root = new THREE.Bone();
        root.position.set(0, 0, 0);
        root.name = 'root';
        bones.push(root);

        // Hips
        const hips = new THREE.Bone();
        hips.position.set(0, 0.9, 0);
        hips.name = 'hips';
        root.add(hips);
        bones.push(hips);

        // Spine
        const spine1 = new THREE.Bone();
        spine1.position.set(0, 0.15, 0);
        spine1.name = 'spine1';
        hips.add(spine1);
        bones.push(spine1);

        const spine2 = new THREE.Bone();
        spine2.position.set(0, 0.15, 0);
        spine2.name = 'spine2';
        spine1.add(spine2);
        bones.push(spine2);

        const chest = new THREE.Bone();
        chest.position.set(0, 0.15, 0);
        chest.name = 'chest';
        spine2.add(chest);
        bones.push(chest);

        // Neck and Head
        const neck = new THREE.Bone();
        neck.position.set(0, 0.15, 0);
        neck.name = 'neck';
        chest.add(neck);
        bones.push(neck);

        const head = new THREE.Bone();
        head.position.set(0, 0.12, 0);
        head.name = 'head';
        neck.add(head);
        bones.push(head);

        // Left Arm
        const leftShoulder = new THREE.Bone();
        leftShoulder.position.set(-0.15, 0.12, 0);
        leftShoulder.name = 'leftShoulder';
        chest.add(leftShoulder);
        bones.push(leftShoulder);

        const leftUpperArm = new THREE.Bone();
        leftUpperArm.position.set(-0.08, 0, 0);
        leftUpperArm.name = 'leftUpperArm';
        leftShoulder.add(leftUpperArm);
        bones.push(leftUpperArm);

        const leftForearm = new THREE.Bone();
        leftForearm.position.set(-0.25, 0, 0);
        leftForearm.name = 'leftForearm';
        leftUpperArm.add(leftForearm);
        bones.push(leftForearm);

        const leftHand = new THREE.Bone();
        leftHand.position.set(-0.2, 0, 0);
        leftHand.name = 'leftHand';
        leftForearm.add(leftHand);
        bones.push(leftHand);

        // Right Arm (mirrored)
        const rightShoulder = new THREE.Bone();
        rightShoulder.position.set(0.15, 0.12, 0);
        rightShoulder.name = 'rightShoulder';
        chest.add(rightShoulder);
        bones.push(rightShoulder);

        const rightUpperArm = new THREE.Bone();
        rightUpperArm.position.set(0.08, 0, 0);
        rightUpperArm.name = 'rightUpperArm';
        rightShoulder.add(rightUpperArm);
        bones.push(rightUpperArm);

        const rightForearm = new THREE.Bone();
        rightForearm.position.set(0.25, 0, 0);
        rightForearm.name = 'rightForearm';
        rightUpperArm.add(rightForearm);
        bones.push(rightForearm);

        const rightHand = new THREE.Bone();
        rightHand.position.set(0.2, 0, 0);
        rightHand.name = 'rightHand';
        rightForearm.add(rightHand);
        bones.push(rightHand);

        // Left Leg
        const leftThigh = new THREE.Bone();
        leftThigh.position.set(-0.1, 0, 0);
        leftThigh.name = 'leftThigh';
        hips.add(leftThigh);
        bones.push(leftThigh);

        const leftShin = new THREE.Bone();
        leftShin.position.set(0, -0.45, 0);
        leftShin.name = 'leftShin';
        leftThigh.add(leftShin);
        bones.push(leftShin);

        const leftFoot = new THREE.Bone();
        leftFoot.position.set(0, -0.45, 0);
        leftFoot.name = 'leftFoot';
        leftShin.add(leftFoot);
        bones.push(leftFoot);

        // Right Leg (mirrored)
        const rightThigh = new THREE.Bone();
        rightThigh.position.set(0.1, 0, 0);
        rightThigh.name = 'rightThigh';
        hips.add(rightThigh);
        bones.push(rightThigh);

        const rightShin = new THREE.Bone();
        rightShin.position.set(0, -0.45, 0);
        rightShin.name = 'rightShin';
        rightThigh.add(rightShin);
        bones.push(rightShin);

        const rightFoot = new THREE.Bone();
        rightFoot.position.set(0, -0.45, 0);
        rightFoot.name = 'rightFoot';
        rightShin.add(rightFoot);
        bones.push(rightFoot);

        // Create skeleton
        this.skeleton = new THREE.Skeleton(bones);

        // Store bone references
        bones.forEach(bone => {
            this.bones[bone.name] = bone;
        });

        // Add to scene
        const skeletonHelper = new THREE.SkeletonHelper(root);
        skeletonHelper.visible = false;
        this.scene.add(skeletonHelper);
        this.skeletonHelper = skeletonHelper;

        this.scene.add(root);
        this.root = root;
    }

    createDetailedHead() {
        // High-poly head
        const headGeo = new THREE.SphereGeometry(0.15, 128, 128);

        // Modify vertices for more feminine shape
        const positions = headGeo.attributes.position;
        for (let i = 0; i < positions.count; i++) {
            const x = positions.getX(i);
            const y = positions.getY(i);
            const z = positions.getZ(i);

            // Narrow chin
            if (y < -0.05) {
                const factor = 1 - (y + 0.15) / 0.1;
                positions.setX(i, x * (1 - factor * 0.3));
                positions.setZ(i, z * (1 - factor * 0.2));
            }

            // Defined cheekbones
            if (y > 0 && y < 0.08 && Math.abs(x) > 0.08) {
                positions.setX(i, x * 1.15);
            }
        }
        positions.needsUpdate = true;
        headGeo.computeVertexNormals();

        const skinMat = this.createSkinMaterial();
        const head = new THREE.SkinnedMesh(headGeo, skinMat);
        head.castShadow = true;
        head.receiveShadow = true;

        // Bind to skeleton
        head.bind(this.skeleton);
        head.skeleton.bones[0] = this.bones.head;

        this.bones.head.add(head);
        this.meshes.push(head);

        // Eyes
        this.createEyes();

        // Face details
        this.createFaceDetails();
    }

    createEyes() {
        const eyeGeo = new THREE.SphereGeometry(0.02, 32, 32);
        const eyeMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.3,
            metalness: 0.1
        });

        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.05, 0.03, 0.13);
        this.bones.head.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.05, 0.03, 0.13);
        this.bones.head.add(rightEye);

        // Pupils
        const pupilGeo = new THREE.SphereGeometry(0.012, 32, 32);
        const pupilMat = new THREE.MeshStandardMaterial({
            color: 0x8e5eff,
            emissive: 0x6b3fa0,
            emissiveIntensity: 0.5,
            roughness: 0.1
        });

        const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
        leftPupil.position.set(-0.05, 0.03, 0.145);
        this.bones.head.add(leftPupil);

        const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
        rightPupil.position.set(0.05, 0.03, 0.145);
        this.bones.head.add(rightPupil);
    }

    createFaceDetails() {
        // Eyebrows
        const browGeo = new THREE.BoxGeometry(0.04, 0.005, 0.01);
        const browMat = new THREE.MeshStandardMaterial({
            color: 0x4a2070,
            roughness: 0.8
        });

        const leftBrow = new THREE.Mesh(browGeo, browMat);
        leftBrow.position.set(-0.05, 0.08, 0.13);
        leftBrow.rotation.z = -0.2;
        this.bones.head.add(leftBrow);

        const rightBrow = new THREE.Mesh(browGeo, browMat);
        rightBrow.position.set(0.05, 0.08, 0.13);
        rightBrow.rotation.z = 0.2;
        this.bones.head.add(rightBrow);

        // Lips
        const lipGeo = new THREE.SphereGeometry(0.03, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const lipMat = new THREE.MeshStandardMaterial({
            color: 0xc97a7a,
            roughness: 0.4,
            metalness: 0.1
        });

        const lips = new THREE.Mesh(lipGeo, lipMat);
        lips.position.set(0, -0.05, 0.13);
        lips.scale.set(1, 0.5, 0.8);
        this.bones.head.add(lips);
    }

    createDetailedTorso() {
        // Create torso with muscle definition
        const points = [];
        const segments = 64;

        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const y = t;

            // Complex shape for torso
            let radius;
            if (t < 0.3) { // Hips
                radius = 0.17 - t * 0.15;
            } else if (t < 0.6) { // Waist
                radius = 0.14 - (t - 0.3) * 0.1;
            } else { // Chest
                radius = 0.15 + (t - 0.6) * 0.15;
            }

            points.push(new THREE.Vector2(radius, y * 0.45 - 0.225));
        }

        const torsoGeo = new THREE.LatheGeometry(points, 128);
        const skinMat = this.createSkinMaterial();
        const torso = new THREE.SkinnedMesh(torsoGeo, skinMat);
        torso.castShadow = true;
        torso.receiveShadow = true;

        torso.bind(this.skeleton);
        this.bones.spine1.add(torso);
        this.meshes.push(torso);
    }

    createDetailedArms() {
        ['left', 'right'].forEach(side => {
            const mult = side === 'left' ? -1 : 1;

            // Upper arm
            const upperArmGeo = new THREE.CylinderGeometry(0.048, 0.052, 0.25, 64);
            const skinMat = this.createSkinMaterial();
            const upperArm = new THREE.SkinnedMesh(upperArmGeo, skinMat);
            upperArm.castShadow = true;
            upperArm.rotation.z = Math.PI / 2 * mult;
            upperArm.position.x = -0.125 * mult;

            upperArm.bind(this.skeleton);
            this.bones[`${side}UpperArm`].add(upperArm);
            this.meshes.push(upperArm);

            // Forearm
            const forearmGeo = new THREE.CylinderGeometry(0.042, 0.045, 0.2, 64);
            const gloveMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                roughness: 0.35,
                metalness: 0.85,
                envMapIntensity: 1.5
            });
            const forearm = new THREE.SkinnedMesh(forearmGeo, gloveMat);
            forearm.castShadow = true;
            forearm.rotation.z = Math.PI / 2 * mult;
            forearm.position.x = -0.1 * mult;

            forearm.bind(this.skeleton);
            this.bones[`${side}Forearm`].add(forearm);
            this.meshes.push(forearm);

            // Hand
            const handGeo = new THREE.SphereGeometry(0.045, 32, 32);
            const hand = new THREE.SkinnedMesh(handGeo, gloveMat);
            hand.castShadow = true;
            hand.scale.set(1, 1.2, 0.8);

            hand.bind(this.skeleton);
            this.bones[`${side}Hand`].add(hand);
            this.meshes.push(hand);
        });
    }

    createDetailedLegs() {
        ['left', 'right'].forEach(side => {
            const mult = side === 'left' ? -1 : 1;

            // Thigh
            const thighGeo = new THREE.CylinderGeometry(0.075, 0.082, 0.45, 64);
            const skinMat = this.createSkinMaterial();
            const thigh = new THREE.SkinnedMesh(thighGeo, skinMat);
            thigh.castShadow = true;
            thigh.position.y = -0.225;

            thigh.bind(this.skeleton);
            this.bones[`${side}Thigh`].add(thigh);
            this.meshes.push(thigh);

            // Shin with boot
            const shinGeo = new THREE.CylinderGeometry(0.06, 0.068, 0.45, 64);
            const bootMat = new THREE.MeshStandardMaterial({
                color: 0x2a1a4a,
                roughness: 0.25,
                metalness: 0.6,
                envMapIntensity: 1.2
            });
            const shin = new THREE.SkinnedMesh(shinGeo, bootMat);
            shin.castShadow = true;
            shin.position.y = -0.225;

            shin.bind(this.skeleton);
            this.bones[`${side}Shin`].add(shin);
            this.meshes.push(shin);

            // Foot
            const footGeo = new THREE.BoxGeometry(0.08, 0.06, 0.16);
            const foot = new THREE.SkinnedMesh(footGeo, bootMat);
            foot.castShadow = true;
            foot.position.set(0, -0.03, 0.05);

            foot.bind(this.skeleton);
            this.bones[`${side}Foot`].add(foot);
            this.meshes.push(foot);
        });
    }

    createDetailedHair() {
        // Main hair volume
        const hairGeo = new THREE.SphereGeometry(0.17, 64, 64, 0, Math.PI * 2, 0, Math.PI * 0.65);
        const hairMat = new THREE.MeshStandardMaterial({
            color: 0x6b3fa0,
            roughness: 0.55,
            metalness: 0.35,
            emissive: 0x3a1860,
            emissiveIntensity: 0.25
        });

        const hair = new THREE.Mesh(hairGeo, hairMat);
        hair.position.y = 0.08;
        hair.rotation.z = -0.15;
        hair.castShadow = true;
        this.bones.head.add(hair);

        // Hair strands with more detail
        for (let i = 0; i < 8; i++) {
            const strandGeo = new THREE.ConeGeometry(0.018, 0.18, 16);
            const strand = new THREE.Mesh(strandGeo, hairMat);
            const angle = (i / 8) * Math.PI - Math.PI / 2;
            const radius = 0.14 + Math.random() * 0.02;

            strand.position.set(
                Math.cos(angle) * radius,
                0.03 - i * 0.025,
                Math.sin(angle) * 0.12
            );
            strand.rotation.z = angle + Math.PI / 2 + (Math.random() - 0.5) * 0.3;
            strand.castShadow = true;
            this.bones.head.add(strand);
        }
    }

    createDetailedArmor() {
        // Chest armor
        const chestGeo = new THREE.SphereGeometry(0.13, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2);
        const armorMat = new THREE.MeshStandardMaterial({
            color: 0x6b3fa0,
            roughness: 0.15,
            metalness: 0.85,
            emissive: 0x4a2070,
            emissiveIntensity: 0.45,
            envMapIntensity: 2.0
        });

        const chest = new THREE.Mesh(chestGeo, armorMat);
        chest.position.set(0, 0.08, 0.09);
        chest.scale.set(1.7, 1.3, 1);
        chest.castShadow = true;
        this.bones.chest.add(chest);

        // Shoulder guards
        ['left', 'right'].forEach(side => {
            const mult = side === 'left' ? -1 : 1;
            const shoulderGeo = new THREE.SphereGeometry(0.09, 64, 64, 0, Math.PI, 0, Math.PI / 2);
            const shoulder = new THREE.Mesh(shoulderGeo, armorMat);
            shoulder.position.set(mult * 0.07, 0.02, 0);
            shoulder.rotation.z = mult * (-Math.PI / 4);
            shoulder.castShadow = true;
            this.bones[`${side}Shoulder`].add(shoulder);
        });

        // Belt
        const beltGeo = new THREE.CylinderGeometry(0.175, 0.175, 0.09, 128);
        const belt = new THREE.Mesh(beltGeo, armorMat);
        belt.position.y = 0.1;
        belt.castShadow = true;
        this.bones.hips.add(belt);

        // Belt gem
        const gemGeo = new THREE.OctahedronGeometry(0.045);
        const gemMat = new THREE.MeshStandardMaterial({
            color: 0x8e5eff,
            metalness: 0.95,
            roughness: 0.05,
            emissive: 0x6b3fa0,
            emissiveIntensity: 1.2,
            envMapIntensity: 2.5
        });
        const gem = new THREE.Mesh(gemGeo, gemMat);
        gem.position.set(0, 0.1, 0.19);
        gem.castShadow = true;
        this.bones.hips.add(gem);

        // Waist cloth panels
        this.createClothPanels();
    }

    createClothPanels() {
        const clothMat = new THREE.MeshStandardMaterial({
            color: 0x6b3fa0,
            roughness: 0.45,
            metalness: 0.25,
            side: THREE.DoubleSide
        });

        // Front panel
        const frontGeo = new THREE.ConeGeometry(0.23, 0.38, 12);
        const front = new THREE.Mesh(frontGeo, clothMat);
        front.position.set(0, -0.09, 0.06);
        front.castShadow = true;
        this.bones.hips.add(front);

        // Back panel
        const backGeo = new THREE.ConeGeometry(0.19, 0.28, 12);
        const back = new THREE.Mesh(backGeo, clothMat);
        back.position.set(0, -0.04, -0.06);
        back.castShadow = true;
        this.bones.hips.add(back);

        // Side panels
        [-0.16, 0.16].forEach(x => {
            const sideGeo = new THREE.ConeGeometry(0.09, 0.22, 8);
            const side = new THREE.Mesh(sideGeo, clothMat);
            side.position.set(x, 0, 0);
            side.rotation.z = x < 0 ? -0.35 : 0.35;
            side.castShadow = true;
            this.bones.hips.add(side);
        });
    }

    createMagicBlades() {
        ['left', 'right'].forEach(side => {
            const mult = side === 'left' ? -1 : 1;

            // Handle
            const handleGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.28, 24);
            const handleMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a0a,
                roughness: 0.25,
                metalness: 0.95
            });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.rotation.z = Math.PI / 2;
            handle.position.x = mult * 0.05;
            handle.castShadow = true;
            this.bones[`${side}Hand`].add(handle);

            // Blade
            const bladeCurve = new THREE.Shape();
            bladeCurve.moveTo(0, 0);
            bladeCurve.quadraticCurveTo(0.15, 0.12, 0.32, 0.32);
            bladeCurve.quadraticCurveTo(0.38, 0.43, 0.32, 0.54);
            bladeCurve.lineTo(0.27, 0.52);
            bladeCurve.quadraticCurveTo(0.32, 0.41, 0.27, 0.3);
            bladeCurve.quadraticCurveTo(0.12, 0.1, 0, 0);

            const bladeGeo = new THREE.ExtrudeGeometry(bladeCurve, {
                depth: 0.025,
                bevelEnabled: true,
                bevelThickness: 0.012,
                bevelSize: 0.012,
                bevelSegments: 8
            });

            const bladeMat = this.createBladeMaterial();
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.rotation.z = mult < 0 ? Math.PI / 2.3 : -Math.PI / 2.3;
            blade.position.set(mult * 0.18, 0, 0);
            blade.castShadow = true;
            this.bones[`${side}Hand`].add(blade);

            this[`${side}Blade`] = blade;
        });
    }

    createTattoos() {
        // Arm tattoos (purple magic runes)
        ['left', 'right'].forEach(side => {
            for (let i = 0; i < 3; i++) {
                const tattooGeo = new THREE.RingGeometry(0.02, 0.025, 32);
                const tattooMat = new THREE.MeshBasicMaterial({
                    color: 0x8e5eff,
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide
                });
                const tattoo = new THREE.Mesh(tattooGeo, tattooMat);
                tattoo.rotation.x = Math.PI / 2;
                tattoo.position.y = -0.1 - i * 0.08;
                this.bones[`${side}UpperArm`].add(tattoo);
            }
        });
    }

    createJewelry() {
        // Choker
        const chokerGeo = new THREE.TorusGeometry(0.082, 0.018, 24, 64);
        const metalMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.2,
            metalness: 0.95
        });
        const choker = new THREE.Mesh(chokerGeo, metalMat);
        choker.rotation.x = Math.PI / 2;
        choker.position.y = -0.08;
        choker.castShadow = true;
        this.bones.neck.add(choker);

        // Earrings
        [-1, 1].forEach(mult => {
            const earringGeo = new THREE.CylinderGeometry(0.008, 0.012, 0.04, 16);
            const earring = new THREE.Mesh(earringGeo, metalMat);
            earring.position.set(mult * 0.12, -0.02, 0.05);
            earring.castShadow = true;
            this.bones.head.add(earring);
        });
    }

    createSkinMaterial() {
        return new THREE.MeshStandardMaterial({
            color: 0xd4a574,
            roughness: 0.65,
            metalness: 0.08,
            envMapIntensity: 0.8
        });
    }

    createBladeMaterial() {
        return new THREE.MeshStandardMaterial({
            color: 0x8e5eff,
            roughness: 0.08,
            metalness: 0.95,
            emissive: 0x6b3fa0,
            emissiveIntensity: 0.6,
            envMapIntensity: 2.5,
            transparent: true,
            opacity: 0.95
        });
    }

    setupAnimations() {
        this.animations.idle = this.createIdleAnimation();
        this.animations.run = this.createRunAnimation();
        this.animations.attack = this.createAttackAnimation();

        this.currentAnimation = 'idle';
    }

    createIdleAnimation() {
        return {
            duration: 2.0,
            loop: true,
            keyframes: (t) => {
                const breath = Math.sin(t * Math.PI * 2) * 0.02;
                this.bones.chest.rotation.x = breath;
                this.bones.spine1.rotation.x = breath * 0.5;

                // Subtle sway
                const sway = Math.sin(t * Math.PI * 2 * 0.5) * 0.05;
                this.bones.hips.rotation.y = sway;
            }
        };
    }

    createRunAnimation() {
        return {
            duration: 0.6,
            loop: true,
            keyframes: (t) => {
                const cycle = t * Math.PI * 2;

                // Lean forward
                this.bones.spine1.rotation.x = 0.3;
                this.bones.chest.rotation.x = 0.2;

                // Bob
                this.bones.hips.position.y = 0.9 + Math.abs(Math.sin(cycle)) * 0.08;

                // Legs
                const leftLegAngle = Math.sin(cycle) * 1.2;
                const rightLegAngle = Math.sin(cycle + Math.PI) * 1.2;

                this.bones.leftThigh.rotation.x = leftLegAngle;
                this.bones.rightThigh.rotation.x = rightLegAngle;

                this.bones.leftShin.rotation.x = Math.max(0, -leftLegAngle * 1.5);
                this.bones.rightShin.rotation.x = Math.max(0, -rightLegAngle * 1.5);

                // Arms counterswing
                this.bones.leftUpperArm.rotation.x = -rightLegAngle * 0.8;
                this.bones.rightUpperArm.rotation.x = -leftLegAngle * 0.8;

                this.bones.leftForearm.rotation.x = Math.max(0, rightLegAngle * 0.5);
                this.bones.rightForearm.rotation.x = Math.max(0, leftLegAngle * 0.5);
            }
        };
    }

    createAttackAnimation() {
        return {
            duration: 1.2,
            loop: false,
            keyframes: (t) => {
                if (t < 0.2) {
                    // Wind up
                    const prep = t / 0.2;
                    this.bones.spine2.rotation.y = -0.8 * prep;
                    this.bones.chest.rotation.y = -0.6 * prep;
                    this.bones.rightUpperArm.rotation.x = -1.5 * prep;
                    this.bones.rightUpperArm.rotation.y = -0.8 * prep;
                    this.bones.rightForearm.rotation.x = 1.2 * prep;
                } else if (t < 0.4) {
                    // Strike 1
                    const strike = (t - 0.2) / 0.2;
                    const ease = 1 - Math.pow(1 - strike, 3);
                    this.bones.spine2.rotation.y = -0.8 + 1.6 * ease;
                    this.bones.chest.rotation.y = -0.6 + 1.2 * ease;
                    this.bones.rightUpperArm.rotation.x = -1.5 + 2.0 * ease;
                    this.bones.rightUpperArm.rotation.y = -0.8 + 1.6 * ease;
                    this.bones.rightForearm.rotation.x = 1.2 - 1.2 * ease;
                } else if (t < 0.55) {
                    // Transition
                    const trans = (t - 0.4) / 0.15;
                    this.bones.spine2.rotation.y = 0.8 - 1.4 * trans;
                    this.bones.leftUpperArm.rotation.x = -1.3 * trans;
                    this.bones.leftForearm.rotation.x = 1.1 * trans;
                } else if (t < 0.75) {
                    // Strike 2
                    const strike2 = (t - 0.55) / 0.2;
                    const ease2 = 1 - Math.pow(1 - strike2, 3);
                    this.bones.spine2.rotation.y = -0.6 + 1.4 * ease2;
                    this.bones.leftUpperArm.rotation.x = -1.3 + 1.8 * ease2;
                    this.bones.leftForearm.rotation.x = 1.1 - 1.1 * ease2;
                } else {
                    // Recovery
                    const recover = (t - 0.75) / 0.45;
                    const easeOut = 1 - Math.pow(1 - recover, 2);
                    this.bones.spine2.rotation.y *= (1 - easeOut);
                    this.bones.chest.rotation.y *= (1 - easeOut);
                    this.bones.leftUpperArm.rotation.x *= (1 - easeOut);
                    this.bones.rightUpperArm.rotation.x *= (1 - easeOut);
                }
            }
        };
    }

    playAnimation(name) {
        if (this.animations[name]) {
            this.currentAnimation = name;
            this.animationTime = 0;
        }
    }

    update(deltaTime) {
        if (!this.currentAnimation || !this.animations[this.currentAnimation]) return;

        const anim = this.animations[this.currentAnimation];
        this.animationTime += deltaTime * this.animationSpeed;

        if (anim.loop) {
            this.animationTime = this.animationTime % anim.duration;
        } else {
            this.animationTime = Math.min(this.animationTime, anim.duration);
        }

        const t = this.animationTime / anim.duration;

        // Reset rotations
        Object.values(this.bones).forEach(bone => {
            bone.rotation.set(0, 0, 0);
            if (bone.name === 'hips') {
                bone.position.y = 0.9;
            }
        });

        anim.keyframes(t);

        // Update skeleton
        if (this.skeleton) {
            this.skeleton.update();
        }
    }

    toggleWireframe(enabled) {
        this.meshes.forEach(mesh => {
            if (mesh.material) {
                mesh.material.wireframe = enabled;
            }
        });
    }

    toggleSkeleton(enabled) {
        if (this.skeletonHelper) {
            this.skeletonHelper.visible = enabled;
        }
    }

    setAnimationSpeed(speed) {
        this.animationSpeed = speed;
    }
}

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d12);
scene.fog = new THREE.FogExp2(0x1e1438, 0.08);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 4);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Post-processing
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.8, // strength
    0.4, // radius
    0.85 // threshold
);
composer.addPass(bloomPass);

const smaaPass = new SMAAPass(window.innerWidth, window.innerHeight);
composer.addPass(smaaPass);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI / 1.8;
controls.target.set(0, 1.2, 0);

// Enhanced Lighting
const ambientLight = new THREE.AmbientLight(0x6b3fa0, 0.4);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
mainLight.position.set(6, 10, 6);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 4096;
mainLight.shadow.mapSize.height = 4096;
mainLight.shadow.camera.near = 0.5;
mainLight.shadow.camera.far = 50;
mainLight.shadow.camera.left = -5;
mainLight.shadow.camera.right = 5;
mainLight.shadow.camera.top = 5;
mainLight.shadow.camera.bottom = -5;
mainLight.shadow.bias = -0.0001;
scene.add(mainLight);

const rimLight1 = new THREE.DirectionalLight(0x8e5eff, 1.5);
rimLight1.position.set(-6, 4, -6);
scene.add(rimLight1);

const rimLight2 = new THREE.DirectionalLight(0x6b3fa0, 1.0);
rimLight2.position.set(0, -3, 5);
scene.add(rimLight2);

const fillLight = new THREE.PointLight(0x8e5eff, 1.5, 10);
fillLight.position.set(0, 1.5, 2);
scene.add(fillLight);

// Environment Map
const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(
    new THREE.RoomEnvironment(), 0.04
).texture;

// Ground with detail
const groundGeo = new THREE.CircleGeometry(10, 128);
const groundMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a2e,
    roughness: 0.85,
    metalness: 0.15,

});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;

scene.add(ground);

// Ground grid pattern
const gridHelper = new THREE.GridHelper(10, 40, 0x4a2070, 0x2a1545);
gridHelper.material.opacity = 0.3;

scene.add(gridHelper);

// Magic particles system
class MagicParticles {
    constructor(count = 100) {
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const velocities = [];
        const lifetimes = [];

        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 0.5 + Math.random() * 1.5;
            positions[i * 3] = Math.cos(angle) * radius;
            positions[i * 3 + 1] = Math.random() * 3;
            positions[i * 3 + 2] = Math.sin(angle) * radius;

            velocities.push({
                x: (Math.random() - 0.5) * 0.02,
                y: Math.random() * 0.03 + 0.02,
                z: (Math.random() - 0.5) * 0.02
            });

            lifetimes.push(Math.random());
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0x8e5eff,
            size: 0.05,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        this.particles = new THREE.Points(geometry, material);
        this.velocities = velocities;
        this.lifetimes = lifetimes;
        this.count = count;
        scene.add(this.particles);
    }

    update() {
        const positions = this.particles.geometry.attributes.position.array;

        for (let i = 0; i < this.count; i++) {
            positions[i * 3] += this.velocities[i].x;
            positions[i * 3 + 1] += this.velocities[i].y;
            positions[i * 3 + 2] += this.velocities[i].z;

            this.lifetimes[i] += 0.008;

            if (positions[i * 3 + 1] > 3.5 || this.lifetimes[i] > 1) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 0.5 + Math.random() * 1.5;
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = Math.sin(angle) * radius;
                this.lifetimes[i] = 0;
            }
        }

        this.particles.geometry.attributes.position.needsUpdate = true;
    }
}

const magicParticles = new MagicParticles(150);

// Character
const character = new AntiMageCharacter(scene);
character.playAnimation('idle');

// UI State
let state = {
    currentAnimation: 'idle',
    showWireframe: false,
    showSkeleton: false,
    showParticles: true,
    animationSpeed: 1.0,
    autoRotate: false,
    rotationSpeed: 0.3
};

// UI Controls
document.getElementById('animIdle').addEventListener('click', () => {
    character.playAnimation('idle');
    state.currentAnimation = 'idle';
    updateAnimButtons();
});

document.getElementById('animRun').addEventListener('click', () => {
    character.playAnimation('run');
    state.currentAnimation = 'run';
    updateAnimButtons();
});

document.getElementById('animAttack').addEventListener('click', () => {
    character.playAnimation('attack');
    state.currentAnimation = 'attack';
    updateAnimButtons();
});

function updateAnimButtons() {
    ['animIdle', 'animRun', 'animAttack'].forEach(id => {
        document.getElementById(id).classList.remove('active');
    });
    const btnMap = {
        'idle': 'animIdle',
        'run': 'animRun',
        'attack': 'animAttack'
    };
    document.getElementById(btnMap[state.currentAnimation]).classList.add('active');
}

document.getElementById('wireframe').addEventListener('change', (e) => {
    state.showWireframe = e.target.checked;
    character.toggleWireframe(state.showWireframe);
});

document.getElementById('skeleton').addEventListener('change', (e) => {
    state.showSkeleton = e.target.checked;
    character.toggleSkeleton(state.showSkeleton);
});

document.getElementById('particles').addEventListener('change', (e) => {
    state.showParticles = e.target.checked;
    magicParticles.particles.visible = state.showParticles;
});

document.getElementById('autoRotate').addEventListener('change', (e) => {
    state.autoRotate = e.target.checked;
    controls.autoRotate = state.autoRotate;
    controls.autoRotateSpeed = state.rotationSpeed;
});

document.getElementById('animSpeed').addEventListener('input', (e) => {
    state.animationSpeed = parseFloat(e.target.value);
    character.setAnimationSpeed(state.animationSpeed);
    document.getElementById('animSpeedValue').textContent = state.animationSpeed.toFixed(1);
});

document.getElementById('rotationSpeed').addEventListener('input', (e) => {
    state.rotationSpeed = parseFloat(e.target.value);
    controls.autoRotateSpeed = state.rotationSpeed;
    document.getElementById('rotationSpeedValue').textContent = state.rotationSpeed.toFixed(1);
});

// Animation loop
const clock = new THREE.Clock();
document.getElementById('loading').style.display = 'none';

function animate() {
    requestAnimationFrame(animate);

    const deltaTime = clock.getDelta();

    character.update(deltaTime);

    if (state.showParticles) {
        magicParticles.update();
    }

    controls.update();
    composer.render();
}

// Window resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});

animate();
