<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Mage Character Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0d12 0%, #1e1438 100%);
            overflow: hidden;
            color: #e9e9ea;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 13, 18, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(142, 94, 255, 0.2);
            z-index: 10;
            min-width: 280px;
        }

        #controls h2 {
            margin: 0 0 16px 0;
            font-size: 18px;
            font-weight: 600;
            color: #8e5eff;
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #b8b8bb;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #2a2d36;
            border-radius: 999px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #8e5eff;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 600;
            color: #8e5eff;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="loading">Loading...</div>

    <div id="controls">
        <h2>Anti-Mage Viewer</h2>

        <div class="control-group">
            <label>Rotation Speed</label>
            <input type="range" id="rotationSpeed" min="0" max="2" step="0.1" value="0.5">
        </div>

        <div class="control-group">
            <label>Model Detail</label>
            <input type="range" id="detailLevel" min="1" max="5" step="1" value="3">
        </div>

        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="wireframe">
                Wireframe Mode
            </label>
        </div>

        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="autoRotate" checked>
                Auto Rotate
            </label>
        </div>

        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="showEffects" checked>
                Magic Effects
            </label>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
    }
    </script>

    <script type="module">
// === Shaders ===
const glowVertexShader = `
varying vec3 vNormal;
varying vec3 vPosition;

void main() {
    vNormal = normalize(normalMatrix * normal);
    vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const glowFragmentShader = `
uniform vec3 glowColor;
uniform float glowIntensity;
varying vec3 vNormal;
varying vec3 vPosition;

void main() {
    vec3 viewDirection = normalize(-vPosition);
    float fresnel = pow(1.0 - dot(viewDirection, vNormal), 3.0);
    vec3 glow = glowColor * fresnel * glowIntensity;

    gl_FragColor = vec4(glow, fresnel * 0.8);
}
`;

const magicBladeVertexShader = `
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vPosition;
uniform float time;

void main() {
    vUv = uv;
    vNormal = normalize(normalMatrix * normal);
    vPosition = position;

    vec3 pos = position;
    pos.y += sin(position.x * 5.0 + time * 2.0) * 0.02;

    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
}
`;

const magicBladeFragmentShader = `
uniform vec3 baseColor;
uniform vec3 glowColor;
uniform float time;
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vPosition;

void main() {
    float flow = sin(vUv.y * 10.0 - time * 3.0) * 0.5 + 0.5;
    float edge = pow(1.0 - abs(vUv.x - 0.5) * 2.0, 2.0);
    vec3 color = mix(baseColor, glowColor, flow * edge);
    float alpha = 0.9 + edge * 0.1;

    gl_FragColor = vec4(color, alpha);
}
`;

const runeVertexShader = `
varying vec2 vUv;
varying vec3 vPosition;

void main() {
    vUv = uv;
    vPosition = position;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const runeFragmentShader = `
uniform float time;
uniform vec3 runeColor;
varying vec2 vUv;
varying vec3 vPosition;

float runePattern(vec2 uv) {
    vec2 center = vec2(0.5, 0.5);
    float dist = length(uv - center);
    float circle = smoothstep(0.4, 0.35, dist);
    circle -= smoothstep(0.35, 0.3, dist);
    float angle = atan(uv.y - center.y, uv.x - center.x);
    float lines = step(0.9, sin(angle * 8.0 + time));
    float symbols = step(0.95, sin(dist * 20.0 - time * 2.0));
    return max(circle, max(lines * 0.5, symbols * 0.3));
}

void main() {
    float pattern = runePattern(vUv);
    float pulse = sin(time * 2.0) * 0.3 + 0.7;
    vec3 color = runeColor * pattern * pulse;
    float alpha = pattern * pulse;
    gl_FragColor = vec4(color, alpha);
}
`;

const skinVertexShader = `
varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;

void main() {
    vNormal = normalize(normalMatrix * normal);
    vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const skinFragmentShader = `
uniform vec3 skinColor;
uniform float roughness;
varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;

float noise(vec2 uv) {
    return fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453);
}

void main() {
    vec3 viewDirection = normalize(-vPosition);
    vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
    float diff = max(dot(vNormal, lightDir), 0.0);
    vec3 reflectDir = reflect(-lightDir, vNormal);
    float spec = pow(max(dot(viewDirection, reflectDir), 0.0), 32.0);
    float backLight = max(0.0, dot(-lightDir, vNormal));
    vec3 subsurface = skinColor * backLight * 0.3;
    float detail = noise(vUv * 50.0) * 0.05;
    vec3 color = skinColor * (diff + 0.2) + spec * 0.3 + subsurface;
    color += detail;
    gl_FragColor = vec4(color, 1.0);
}
`;

// === Main Application ===
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d12);
scene.fog = new THREE.Fog(0x1e1438, 10, 50);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 2;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI / 1.5;

const ambientLight = new THREE.AmbientLight(0x8e5eff, 0.3);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
mainLight.position.set(5, 8, 5);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;
scene.add(mainLight);

const rimLight = new THREE.DirectionalLight(0x8e5eff, 0.8);
rimLight.position.set(-5, 3, -5);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0x4a2eb0, 0.5);
fillLight.position.set(0, -2, 3);
scene.add(fillLight);

const groundGeometry = new THREE.CircleGeometry(8, 64);
const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x1a1a2e,
    roughness: 0.8,
    metalness: 0.2
});
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

class AntiMageCharacter {
    constructor(detailLevel = 3) {
        this.group = new THREE.Group();
        this.detailLevel = detailLevel;
        this.clock = new THREE.Clock();
        this.blades = [];
        this.build();
    }

    build() {
        while(this.group.children.length > 0) {
            this.group.remove(this.group.children[0]);
        }
        this.blades = [];

        const skinMaterial = new THREE.ShaderMaterial({
            uniforms: {
                skinColor: { value: new THREE.Color(0xd4a574) },
                roughness: { value: 0.6 }
            },
            vertexShader: skinVertexShader,
            fragmentShader: skinFragmentShader
        });

        const purpleMaterial = new THREE.MeshStandardMaterial({
            color: 0x6b3fa0,
            roughness: 0.2,
            metalness: 0.7,
            emissive: 0x4a2070,
            emissiveIntensity: 0.4
        });

        const blackMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.3,
            metalness: 0.9
        });

        const hairMaterial = new THREE.MeshStandardMaterial({
            color: 0x6b3fa0,
            roughness: 0.6,
            metalness: 0.3,
            emissive: 0x3a1860,
            emissiveIntensity: 0.2
        });

        // Head
        const headGeometry = new THREE.SphereGeometry(0.15, 64, 64);
        const head = new THREE.Mesh(headGeometry, skinMaterial);
        head.position.y = 1.65;
        head.scale.set(1, 1.15, 0.95);
        head.castShadow = true;
        head.receiveShadow = true;
        this.group.add(head);

        // Neck
        const neckGeo = new THREE.CylinderGeometry(0.06, 0.065, 0.12, 32);
        const neck = new THREE.Mesh(neckGeo, skinMaterial);
        neck.position.y = 1.52;
        neck.castShadow = true;
        this.group.add(neck);

        this.createHair(hairMaterial);

        const torsoGeometry = this.createTorsoGeometry();
        const torso = new THREE.Mesh(torsoGeometry, skinMaterial);
        torso.position.y = 1.25;
        torso.castShadow = true;
        torso.receiveShadow = true;
        this.group.add(torso);

        this.createChestArmor(purpleMaterial);

        const collarGeo = new THREE.TorusGeometry(0.08, 0.015, 16, 32);
        const collar = new THREE.Mesh(collarGeo, blackMaterial);
        collar.position.y = 1.58;
        collar.rotation.x = Math.PI / 2;
        collar.castShadow = true;
        this.group.add(collar);

        this.createShoulderGuard(-0.22, purpleMaterial);
        this.createShoulderGuard(0.22, purpleMaterial);
        this.createBelt(purpleMaterial, blackMaterial);
        this.createWaistCloth(purpleMaterial);
        this.createArm(-0.25, true);
        this.createArm(0.25, false);
        this.createLeg(-0.1, true);
        this.createLeg(0.1, false);
        this.createBlade(-0.5, true);
        this.createBlade(0.5, false);
        this.addGlowEffects();
    }

    createTorsoGeometry() {
        const points = [];
        const segments = 32;
        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const y = t - 0.5;
            let radius = 0.18 - Math.abs(y) * 0.15;
            if (t > 0.7) radius += (t - 0.7) * 0.1;
            points.push(new THREE.Vector2(radius, y * 0.5));
        }
        return new THREE.LatheGeometry(points, 64);
    }

    createHair(material) {
        const hairGeo = new THREE.SphereGeometry(0.17, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.6);
        const hair = new THREE.Mesh(hairGeo, material);
        hair.position.y = 1.7;
        hair.rotation.z = -0.2;
        hair.castShadow = true;
        this.group.add(hair);

        for (let i = 0; i < 5; i++) {
            const strandGeo = new THREE.ConeGeometry(0.02, 0.15, 8);
            const strand = new THREE.Mesh(strandGeo, material);
            const angle = (i / 5) * Math.PI - Math.PI / 2;
            strand.position.set(
                Math.cos(angle) * 0.15,
                1.65 - i * 0.03,
                Math.sin(angle) * 0.1
            );
            strand.rotation.z = angle + Math.PI / 2;
            strand.castShadow = true;
            this.group.add(strand);
        }
    }

    createChestArmor(material) {
        const chestGeo = new THREE.SphereGeometry(0.12, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const chest = new THREE.Mesh(chestGeo, material);
        chest.position.set(0, 1.38, 0.08);
        chest.scale.set(1.6, 1.2, 1);
        chest.castShadow = true;
        this.group.add(chest);

        const runeGeo = new THREE.PlaneGeometry(0.1, 0.1);
        const runeMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                runeColor: { value: new THREE.Color(0x8e5eff) }
            },
            vertexShader: runeVertexShader,
            fragmentShader: runeFragmentShader,
            transparent: true,
            side: THREE.DoubleSide
        });

        const rune = new THREE.Mesh(runeGeo, runeMaterial);
        rune.position.set(0, 1.38, 0.18);
        this.group.add(rune);
        this.rune = rune;
    }

    createShoulderGuard(xOffset, material) {
        const shoulderGeo = new THREE.SphereGeometry(0.08, 32, 32, 0, Math.PI, 0, Math.PI / 2);
        const shoulder = new THREE.Mesh(shoulderGeo, material);
        shoulder.position.set(xOffset, 1.42, 0);
        shoulder.rotation.z = xOffset < 0 ? -Math.PI / 4 : Math.PI / 4;
        shoulder.castShadow = true;
        this.group.add(shoulder);
    }

    createBelt(purpleMat, blackMat) {
        const beltGeo = new THREE.CylinderGeometry(0.17, 0.17, 0.08, 64);
        const belt = new THREE.Mesh(beltGeo, purpleMat);
        belt.position.y = 1.0;
        belt.castShadow = true;
        this.group.add(belt);

        const gemGeo = new THREE.OctahedronGeometry(0.04);
        const gemMat = new THREE.MeshStandardMaterial({
            color: 0x8e5eff,
            metalness: 0.9,
            roughness: 0.1,
            emissive: 0x6b3fa0,
            emissiveIntensity: 0.8
        });
        const gem = new THREE.Mesh(gemGeo, gemMat);
        gem.position.set(0, 1.0, 0.18);
        gem.castShadow = true;
        this.group.add(gem);
    }

    createWaistCloth(material) {
        const clothGeo = new THREE.ConeGeometry(0.22, 0.35, 8);
        const cloth = new THREE.Mesh(clothGeo, material);
        cloth.position.set(0, 0.82, 0.05);
        cloth.castShadow = true;
        this.group.add(cloth);

        const backClothGeo = new THREE.ConeGeometry(0.18, 0.25, 8);
        const backCloth = new THREE.Mesh(backClothGeo, material);
        backCloth.position.set(0, 0.87, -0.05);
        backCloth.castShadow = true;
        this.group.add(backCloth);

        [-0.15, 0.15].forEach(x => {
            const sideGeo = new THREE.ConeGeometry(0.08, 0.2, 6);
            const side = new THREE.Mesh(sideGeo, material);
            side.position.set(x, 0.9, 0);
            side.rotation.z = x < 0 ? -0.3 : 0.3;
            side.castShadow = true;
            this.group.add(side);
        });
    }

    addGlowEffects() {
        const glowMaterial = new THREE.ShaderMaterial({
            uniforms: {
                glowColor: { value: new THREE.Color(0x8e5eff) },
                glowIntensity: { value: 0.5 }
            },
            vertexShader: glowVertexShader,
            fragmentShader: glowFragmentShader,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            transparent: true
        });

        const glowGeo = new THREE.SphereGeometry(0.16, 32, 32);
        const glow = new THREE.Mesh(glowGeo, glowMaterial);
        glow.position.y = 1.65;
        glow.scale.set(1.2, 1.3, 1.1);
        this.group.add(glow);
    }

    update() {
        const time = this.clock.getElapsedTime();
        if (this.rune && this.rune.material.uniforms) {
            this.rune.material.uniforms.time.value = time;
        }
        if (this.blades) {
            this.blades.forEach(blade => {
                if (blade.material.uniforms && blade.material.uniforms.time) {
                    blade.material.uniforms.time.value = time;
                }
            });
        }
    }

    createArm(xOffset, isLeft) {
        const skinMaterial = new THREE.MeshStandardMaterial({
            color: 0xd4a574,
            roughness: 0.6,
            metalness: 0.1
        });

        const blackMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.4,
            metalness: 0.8
        });

        const purpleMaterial = new THREE.MeshStandardMaterial({
            color: 0x6b3fa0,
            roughness: 0.3,
            metalness: 0.6,
            emissive: 0x4a2070,
            emissiveIntensity: 0.3
        });

        const upperArmGeo = new THREE.CylinderGeometry(0.045, 0.05, 0.35, 16 * this.detailLevel);
        const upperArm = new THREE.Mesh(upperArmGeo, skinMaterial);
        upperArm.position.set(xOffset, 1.25, 0);
        upperArm.rotation.z = isLeft ? 0.3 : -0.3;
        upperArm.castShadow = true;
        this.group.add(upperArm);

        const bandGeo = new THREE.CylinderGeometry(0.051, 0.051, 0.04, 16);
        const band = new THREE.Mesh(bandGeo, purpleMaterial);
        band.position.set(xOffset * 1.2, 1.15, 0);
        band.rotation.z = isLeft ? 0.3 : -0.3;
        band.castShadow = true;
        this.group.add(band);

        const forearmGeo = new THREE.CylinderGeometry(0.04, 0.045, 0.35, 16 * this.detailLevel);
        const forearm = new THREE.Mesh(forearmGeo, blackMaterial);
        forearm.position.set(xOffset * 1.5, 0.85, 0);
        forearm.rotation.z = isLeft ? 0.2 : -0.2;
        forearm.castShadow = true;
        this.group.add(forearm);

        const handGeo = new THREE.SphereGeometry(0.045, 16 * this.detailLevel, 16 * this.detailLevel);
        const hand = new THREE.Mesh(handGeo, blackMaterial);
        hand.position.set(xOffset * 1.8, 0.65, 0);
        hand.castShadow = true;
        this.group.add(hand);
    }

    createLeg(xOffset, isLeft) {
        const skinMaterial = new THREE.MeshStandardMaterial({
            color: 0xd4a574,
            roughness: 0.6,
            metalness: 0.1
        });

        const bootMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a1a4a,
            roughness: 0.3,
            metalness: 0.5
        });

        const thighGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.45, 16 * this.detailLevel);
        const thigh = new THREE.Mesh(thighGeo, skinMaterial);
        thigh.position.set(xOffset, 0.65, 0);
        thigh.castShadow = true;
        this.group.add(thigh);

        const shinGeo = new THREE.CylinderGeometry(0.06, 0.07, 0.45, 16 * this.detailLevel);
        const shin = new THREE.Mesh(shinGeo, bootMaterial);
        shin.position.set(xOffset, 0.2, 0);
        shin.castShadow = true;
        this.group.add(shin);

        const footGeo = new THREE.BoxGeometry(0.08, 0.06, 0.15);
        const foot = new THREE.Mesh(footGeo, bootMaterial);
        foot.position.set(xOffset, 0.03, 0.04);
        foot.castShadow = true;
        this.group.add(foot);
    }

    createBlade(xOffset, isLeft) {
        const handleGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.25, 12 * this.detailLevel);
        const handleMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.3,
            metalness: 0.9
        });
        const handle = new THREE.Mesh(handleGeo, handleMat);
        handle.position.set(xOffset * 2, 0.65, 0);
        handle.rotation.z = isLeft ? Math.PI / 4 : -Math.PI / 4;
        handle.castShadow = true;
        this.group.add(handle);

        const bladeCurve = new THREE.Shape();
        bladeCurve.moveTo(0, 0);
        bladeCurve.quadraticCurveTo(0.15, 0.1, 0.3, 0.3);
        bladeCurve.quadraticCurveTo(0.35, 0.4, 0.3, 0.5);
        bladeCurve.lineTo(0.25, 0.48);
        bladeCurve.quadraticCurveTo(0.3, 0.38, 0.25, 0.28);
        bladeCurve.quadraticCurveTo(0.1, 0.08, 0, 0);

        const bladeGeo = new THREE.ExtrudeGeometry(bladeCurve, {
            depth: 0.02,
            bevelEnabled: true,
            bevelThickness: 0.01,
            bevelSize: 0.01,
            bevelSegments: 4 * this.detailLevel
        });

        const bladeMat = new THREE.ShaderMaterial({
            uniforms: {
                baseColor: { value: new THREE.Color(0x8e5eff) },
                glowColor: { value: new THREE.Color(0xffffff) },
                time: { value: 0 }
            },
            vertexShader: magicBladeVertexShader,
            fragmentShader: magicBladeFragmentShader,
            transparent: true
        });

        const blade = new THREE.Mesh(bladeGeo, bladeMat);
        blade.position.copy(handle.position);
        blade.position.y -= 0.15;
        blade.rotation.z = isLeft ? Math.PI / 2.5 : -Math.PI / 2.5;
        blade.castShadow = true;
        this.group.add(blade);
        this.blades.push(blade);
    }
}

class MagicEffects {
    constructor() {
        this.group = new THREE.Group();
        this.particles = [];
        this.createParticles();
    }

    createParticles() {
        const particleGeometry = new THREE.SphereGeometry(0.02, 8, 8);
        const particleMaterial = new THREE.MeshBasicMaterial({
            color: 0x8e5eff,
            transparent: true,
            opacity: 0.6
        });

        for (let i = 0; i < 50; i++) {
            const particle = new THREE.Mesh(particleGeometry, particleMaterial.clone());
            const angle = (i / 50) * Math.PI * 2;
            const radius = 0.5 + Math.random() * 0.5;

            particle.position.set(
                Math.cos(angle) * radius,
                Math.random() * 2,
                Math.sin(angle) * radius
            );

            particle.userData.velocity = {
                x: (Math.random() - 0.5) * 0.01,
                y: Math.random() * 0.02 + 0.01,
                z: (Math.random() - 0.5) * 0.01
            };

            particle.userData.life = Math.random();

            this.particles.push(particle);
            this.group.add(particle);
        }
    }

    update() {
        this.particles.forEach(particle => {
            particle.position.x += particle.userData.velocity.x;
            particle.position.y += particle.userData.velocity.y;
            particle.position.z += particle.userData.velocity.z;

            particle.userData.life += 0.01;

            if (particle.position.y > 3) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 0.5 + Math.random() * 0.5;
                particle.position.set(
                    Math.cos(angle) * radius,
                    0,
                    Math.sin(angle) * radius
                );
                particle.userData.life = 0;
            }

            particle.material.opacity = 0.6 * (1 - particle.userData.life % 1);
        });
    }
}

let character = new AntiMageCharacter(3);
character.group.position.y = 0;
scene.add(character.group);

const magicEffects = new MagicEffects();
scene.add(magicEffects.group);

let autoRotate = true;
let rotationSpeed = 0.5;
let showEffects = true;

document.getElementById('rotationSpeed').addEventListener('input', (e) => {
    rotationSpeed = parseFloat(e.target.value);
});

document.getElementById('detailLevel').addEventListener('input', (e) => {
    const level = parseInt(e.target.value);
    scene.remove(character.group);
    character = new AntiMageCharacter(level);
    scene.add(character.group);
});

document.getElementById('wireframe').addEventListener('change', (e) => {
    character.group.traverse((child) => {
        if (child.isMesh) {
            child.material.wireframe = e.target.checked;
        }
    });
});

document.getElementById('autoRotate').addEventListener('change', (e) => {
    autoRotate = e.target.checked;
});

document.getElementById('showEffects').addEventListener('change', (e) => {
    showEffects = e.target.checked;
    magicEffects.group.visible = showEffects;
});

document.getElementById('loading').style.display = 'none';

function animate() {
    requestAnimationFrame(animate);

    if (autoRotate) {
        character.group.rotation.y += 0.01 * rotationSpeed;
    }

    character.update();

    if (showEffects) {
        magicEffects.update();
    }

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
    </script>
</body>
</html>
